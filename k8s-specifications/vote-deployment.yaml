apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/jerriemiah/example-voting-app-vote:16851844c4be1b7ed2b92636209ef20efb7a8aaf
        imagePullPolicy: Always
        name: vote
        ports:
        - containerPort: 80
          name: vote

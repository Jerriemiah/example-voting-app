apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - image: ghcr.io/jerriemiah/example-voting-app-worker:e0492907d8f45dd038ccc52469f0b5add2f56017
        imagePullPolicy: Always
        name: worker

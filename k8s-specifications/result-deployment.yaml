apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: ghcr.io/jerriemiah/example-voting-app-result:16851844c4be1b7ed2b92636209ef20efb7a8aaf
        imagePullPolicy: Always
        name: result
        ports:
        - containerPort: 80
          name: result

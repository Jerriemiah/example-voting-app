name: CI - Test, Scan, Build and Publish

'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  #IMAGE_NAMESPACE: ${{ github.repository_owner }}/example-voting-app

jobs:
  validate:
    name: Validate application code
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Vote application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vote/requirements.txt
          python -m compileall vote

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Build Worker application
        run: dotnet build worker/Worker.csproj --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: result/package-lock.json

      - name: Install Result dependencies
        working-directory: result
        run: npm ci

  integration-test:
    name: Run result integration test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run voting stack integration test
        working-directory: result
        run: |
          docker compose \
            -f docker-compose.test.yml \
            up --build --abort-on-container-exit --exit-code-from sut

      - name: Collect Compose logs on failure
        if: failure()
        working-directory: result
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Clean up test environment
        if: always()
        working-directory: result
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  build-scan-publish:
    name: Build, scan and publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: integration-test

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: ./vote
            image_name: vote
          - service: worker
            context: ./worker
            image_name: worker
          - service: result
            context: ./result
            image_name: result

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: lowercase_owner
        run: |
          echo "IMAGE_NAMESPACE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/example-voting-app" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.image_name }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.image_name }}:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SHA-tagged image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          docker push \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.image_name }}:${{ github.sha }}"

  deploy:
    name: Deploy to Amazon EKS with Helm
    runs-on: ubuntu-latest
    needs: build-scan-publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      KUBERNETES_NAMESPACE: voting-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        run: |
          echo "IMAGE_NAMESPACE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/example-voting-app" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Deploy application with Helm
        run: |
          helm upgrade --install voting-app ./voting-app \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --create-namespace \
            --set vote.image.tag=${GITHUB_SHA} \
            --set result.image.tag=${GITHUB_SHA} \
            --set worker.image.tag=${GITHUB_SHA}

      - name: Wait for Vote rollout
        run: |
          kubectl rollout status deployment/voting-app-vote \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --timeout=180s

      - name: Wait for Result rollout
        run: |
          kubectl rollout status deployment/voting-app-result \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --timeout=180s

      - name: Wait for Worker rollout
        run: |
          kubectl rollout status deployment/voting-app-worker \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --timeout=180s

      - name: Verify application endpoints
        run: |
          kubectl run ci-smoke-test --rm -i \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -- curl -fsS http://vote:8080/ >/dev/null

          kubectl run ci-smoke-test-result --rm -i \
            --image=curlimages/curl:8.10.1 \
            --restart=Never \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -- curl -fsS http://result:8081/ >/dev/null  
